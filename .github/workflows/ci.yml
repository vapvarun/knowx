name: CI

# Every job blocks the merge. The same commands run on a developer machine (see CONTRIBUTING.md).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  php-lint:
    name: PHP Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Check PHP syntax
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if ! out=$(php -l "$file" 2>&1); then echo "$out"; status=1; fi
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -not -path './dist/*' -print0)
          exit $status

  php-quality:
    name: PHPCS, PHPStan and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: WordPress coding standards (repo config, 0 errors and 0 warnings)
        run: vendor/bin/phpcs --standard=phpcs.xml.dist
      - name: PHPStan level 5
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G
      - name: Unit tests
        run: vendor/bin/phpunit

  assets:
    name: Lint and build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, tsc, stylelint, theme.json)
        run: npm run lint
      - name: Build and check that the committed built files are current
        run: |
          npm run build
          git diff --exit-code -- assets
          test -z "$(git status --porcelain -- assets)"

  integration:
    name: Integration tests (WordPress)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run the integration suite against the latest WordPress
        run: bash tests/docker/run-integration.sh
